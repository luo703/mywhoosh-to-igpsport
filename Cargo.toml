[package]
name = "mywhoosh-to-igpsport"
version = "0.1.0"
edition = "2021"
description = "Sync MyWhoosh FIT activities to iGPSPORT China"
license = "MIT"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1"
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
chrono = "0.4"
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
directories = "6"
fitparser = "0.10"
fs2 = "0.4"
hex = "0.4"
md-5 = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rpassword = "7"
uuid = { version = "1", features = ["v4"] }
wasmi = "0.46"
zeroize = "1"

[profile.release]
lto = "thin"
strip = true
